{% extends "base.html" %}
{% block content %}
<h2>Edit Customer</h2>
<form method="POST">
    <div class="form-group">
        <label>Username:</label>
        <input type="text" name="username" value="{{ customer.username }}" required>
    </div>
    <div class="form-group">
        <label>Email:</label>
        <input type="email" name="email" value="{{ customer.email }}" required>
    </div>
    <div class="form-group">
        <label>New Password (leave blank if unchanged):</label>
        <input type="password" name="password">
    </div>
    <div class="form-group">
        <label>Is Staff:</label>
        <select name="is_staff">
            <option value="false" {% if not customer.is_staff %}selected{% endif %}>No</option>
            <option value="true" {% if customer.is_staff %}selected{% endif %}>Yes</option>
        </select>
    </div>
    <button type="submit" class="btn-submit">Update Customer</button>
</form>
{% endblock %}
